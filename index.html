    <!-- ===== Theme bootstrap (apply saved theme before paint to avoid FOUC) ===== -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('smartkas_theme');
          var theme = saved || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- ============================================================
         SECURITY HARDENING — Anti Inspect / Anti DevTools / Anti Theft
         - Disable right-click context menu (except inside input/textarea)
         - Disable F12, Ctrl+Shift+I/J/C, Ctrl+U (view source)
         - Detect devtools open via debugger timing & window-size trap
         - Block common drag-and-drop of page content out of the app
         - Console warning to deter casual inspection
         NOTE: This is client-side hardening only — it raises the bar
         but cannot make a public web bundle fully reverse-engineering
         proof. Real secrets MUST live in Firestore Rules + Cloud
         Functions, never in client code.
         ============================================================ -->
    <script>
      (function () {
        if (typeof window === 'undefined') return;

        // ---- 1. Disable right-click context menu (allow on form fields) ----
        document.addEventListener('contextmenu', function (e) {
          var tag = (e.target && e.target.tagName) || '';
          if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
            e.preventDefault();
            return false;
          }
        });

        // ---- 2. Block inspection keyboard shortcuts ----
        document.addEventListener('keydown', function (e) {
          // F12
          if (e.key === 'F12') { e.preventDefault(); return false; }
          // Ctrl+Shift+I / J / C (devtools)
          if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.key === 'i' || e.key === 'j' || e.key === 'c')) {
            e.preventDefault(); return false;
          }
          // Ctrl+U (view source)
          if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
            e.preventDefault(); return false;
          }
          // Ctrl+S (save page) — keep it from trivially saving the bundle
          if (e.ctrlKey && (e.key === 'S' || e.key === 's')) {
            e.preventDefault(); return false;
          }
        });

        // ---- 2.5. Block copy/cut but ALLOW paste (users need to paste into inputs) ----
        document.addEventListener('copy', function (e) {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
          e.preventDefault();
          return false;
        });
        document.addEventListener('cut', function (e) {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
          e.preventDefault();
          return false;
        });

        // ---- 3. Block drag-and-drop of images/links out of the page ----
        document.addEventListener('dragstart', function (e) {
          e.preventDefault();
          return false;
        });

        // ---- 4. Devtools detection via debugger timing ----
        // When devtools is open, the `debugger` statement pauses execution
        // and the time delta balloons well past 100ms.
        setInterval(function () {
          var before = new Date().getTime();
          // eslint-disable-next-line no-debugger
          debugger;
          var after = new Date().getTime();
          if (after - before > 100) {
            document.body.innerHTML =
              '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#000;color:#fff;font-family:monospace;font-size:24px;text-align:center;padding:1rem;">' +
              '<div><div style="font-size:48px;margin-bottom:1rem;">&#9888;&#65039;</div>' +
              'Security Violation: DevTools Detected<br/>' +
              '<span style="font-size:14px;opacity:.7;display:block;margin-top:.5rem;">Silakan tutup Developer Tools untuk melanjutkan.</span>' +
              '</div></div>';
          }
        }, 1500);

        // ---- 5. Devtools detection via window-size gap (devtools docked) ----
        // When devtools is docked, the outer window size shrinks while the
        // inner size shrinks more. A threshold > 200px in either dimension
        // is a strong signal.
        var threshold = 200;
        function detectDevToolsBySize() {
          var wDiff = window.outerWidth - window.innerWidth;
          var hDiff = window.outerHeight - window.innerHeight;
          if (wDiff > threshold || hDiff > threshold) {
            document.body.innerHTML =
              '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#000;color:#fff;font-family:monospace;font-size:24px;text-align:center;padding:1rem;">' +
              '<div><div style="font-size:48px;margin-bottom:1rem;">&#9888;&#65039;</div>' +
              'Security Violation: DevTools Detected<br/>' +
              '<span style="font-size:14px;opacity:.7;display:block;margin-top:.5rem;">Silakan tutup Developer Tools untuk melanjutkan.</span>' +
              '</div></div>';
          }
        }
        setInterval(detectDevToolsBySize, 2000);

        // ---- 6. Console warning banner ----
        try {
          var banner =
            '%c🛑 STOP 🛑\n\n' +
            'This is a secured school finance application.\n' +
            'If someone told you to type or paste anything here, it is a SCAM ' +
            'and could give them full access to school funds.\n\n' +
            'Please close this window immediately.';
          console.log(banner, 'color:#f43f5e;font-size:14px;font-weight:bold;');
        } catch (e) {}

        // ---- 7. Clear console periodically to wipe stacked messages ----
        setInterval(function () {
          try { console.clear(); } catch (e) {}
        }, 5000);
      })();
    </script>
